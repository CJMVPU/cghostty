name: cghostty macOS arm64
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    # Xcode 27 arm64 preview image; the setup step verifies macOS 27+.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Apple Silicon tools
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          brew install nushell gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          bash scripts/install-zig.sh "$RUNNER_TEMP/cghostty-tools"
          echo "$RUNNER_TEMP/cghostty-tools/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"
          xcodebuild -downloadComponent MetalToolchain
          xcrun --toolchain Metal metal --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: macos-arm64-zig016-${{ hashFiles('build.zig.zon', 'pkg/**/build.zig.zon') }}-${{ github.sha }}
          restore-keys: macos-arm64-zig016-${{ hashFiles('build.zig.zon', 'pkg/**/build.zig.zon') }}-
      - name: Check macOS-only boundaries
        run: python3 scripts/check-scope.py
      - name: Core regression tests
        run: |
          zig build test -Dtest-filter=renderer
          zig build test -Dtest-filter=config
          zig build test -Dtest-filter=Command
          zig build test -Dtest-filter=Terminal
      - name: Build and test native app
        run: nu macos/build.nu --action test
      - name: Build release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            nu macos/build.nu --configuration ReleaseLocal --version "${GITHUB_REF_NAME#v}"
          else
            nu macos/build.nu --configuration ReleaseLocal
          fi
          python3 scripts/check-scope.py --app macos/build/ReleaseLocal/cghostty.app
          bash macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cghostty-macos-arm64
          path: artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    # Xcode 27 arm64 preview image; the setup step verifies macOS 27+.
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cghostty-macos-arm64
          path: artifacts
      - name: Create draft release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --title "cghostty $RELEASE_TAG" --notes 'Apple Silicon macOS build. This automated package uses ad-hoc signing; Developer ID signing and notarization are not configured in CI.'
