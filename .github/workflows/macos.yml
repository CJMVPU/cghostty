name: cghostty macOS arm64
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    # Xcode 27 arm64 preview image; the setup step verifies macOS 27+.
    runs-on: xcode-27
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Apple Silicon tools
        id: tools
        run: |
          mkdir -p macos/build/ci-logs
          exec > >(tee macos/build/ci-logs/setup.log) 2>&1
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          python3 scripts/check-versions.py
          brew install nushell gettext swiftlint actionlint
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          zig_bin="$(bash scripts/install-zig.sh "$RUNNER_TEMP/cghostty-tools")"
          echo "$zig_bin" >> "$GITHUB_PATH"
          echo "sdk=$(xcrun --show-sdk-build-version)" >> "$GITHUB_OUTPUT"
          xcodebuild -downloadComponent MetalToolchain
          xcrun --toolchain Metal metal --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-pkg
          key: macos-arm64-${{ steps.tools.outputs.sdk }}-${{ hashFiles('scripts/zig-toolchain.json', 'build.zig.zon', 'pkg/**/build.zig.zon') }}-${{ github.sha }}
          restore-keys: macos-arm64-${{ steps.tools.outputs.sdk }}-${{ hashFiles('scripts/zig-toolchain.json', 'build.zig.zon', 'pkg/**/build.zig.zon') }}-
      - name: Check formatting and version records
        run: |
          {
            zig fmt --check build.zig build.zig.zon src pkg
            swiftlint lint --strict --no-cache
            python3 scripts/check-versions.py
            python3 scripts/check-swift6.py
            actionlint
          } 2>&1 | tee macos/build/ci-logs/quality.log
      - name: Check macOS-only boundaries
        run: python3 scripts/check-scope.py 2>&1 | tee macos/build/ci-logs/scope.log
      - name: Core regression tests
        run: |
          zig build test -Dtest-filter=renderer -Dtest-filter=config -Dtest-filter=Command -Dtest-filter=Terminal \
            2>&1 | tee macos/build/ci-logs/core-tests.log
      - name: Build and test native app
        run: |
          nu macos/build.nu --action test --result-bundle macos/build/TestResults.xcresult \
            2>&1 | tee macos/build/ci-logs/native-tests.log
      - name: Build release
        shell: bash
        run: |
          exec > >(tee macos/build/ci-logs/release.log) 2>&1
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            nu macos/build.nu --configuration ReleaseLocal --version "${GITHUB_REF_NAME#v}"
          else
            nu macos/build.nu --configuration ReleaseLocal
          fi
          python3 scripts/check-scope.py --app macos/build/ReleaseLocal/cghostty.app
          bash macos/package.sh
      - name: Preserve build logs and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cghostty-ci-diagnostics
          path: |
            macos/build/ci-logs/
            macos/build/TestResults.xcresult/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cghostty-macos-arm64
          path: artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    # Xcode 27 arm64 preview image; the setup step verifies macOS 27+.
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cghostty-macos-arm64
          path: artifacts
      - name: Create draft release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A locally verified release may already have been published for this tag.
          if gh release view "$RELEASE_TAG" --json url; then
            echo "Release already exists; preserving its assets and publication state."
            exit 0
          fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --title "cghostty $RELEASE_TAG" --notes 'Apple Silicon macOS build. This automated package uses ad-hoc signing; Developer ID signing and notarization are not configured in CI.'
